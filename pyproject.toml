[project]
name = "rustfs-tests"
version = "0.1.0"
description = "Automated test suite for RustFS S3-compatible object storage"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.58",
    "boto3-stubs[s3]>=1.43.58",
    "botocore>=1.43.58",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "typeguard>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: browser tests requiring Playwright and Chromium",
]
addopts = "-v --tb=short --html=reports/report.html --self-contained-html"
log_cli = false
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%H:%M:%S"

[tool.ty]
[tool.ty.src]
exclude = [".pytest_cache"]
[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "types-requests>=2.33.0.20260712",
]
